<script type="importmap">

<style>
  :root {
    --bg: #0e1020;
    --lyric: #4d5480;      /* words not yet sung */
    --hi: #ffe2b0;         /* the word being sung */
    --secondary: #7c84b3;  /* track info, hints */
    --edge: #69afff;       /* constellation paths and active accents */
    --past: #c7a77f;
    --custom-background: none;
    --ease: cubic-bezier(.2,.7,.2,1);
    --pad: calc(clamp(24px, 7vw, 120px) * var(--ui-scale));
    --fs: calc(clamp(28px, 5.2vw, 76px) * var(--ui-scale));
    --ui-scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: var(--secondary); }

  #stage { position: absolute; inset: 0; overflow: hidden; }
  #stage { font-size: calc(16px * var(--ui-scale)); }
  #space-bg { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity .45s ease, background .25s ease; }
  #custom-background-image { position:absolute; inset:0; z-index:0; width:100%; height:100%; display:none; pointer-events:none; }
  body[data-space="image"] #custom-background-image { display:block; }
  body[data-space="image"][data-image-fit="fill"] #custom-background-image { width:100%; height:100%; object-fit:cover; }
  body[data-space="image"][data-image-fit="fit"] #custom-background-image { width:100%; height:100%; object-fit:contain; }
  body[data-space="image"][data-image-fit="original"] #custom-background-image { width:auto; height:auto; max-width:100%; max-height:100%; object-fit:contain; left:50%; top:50%; right:auto; bottom:auto; transform:translate(-50%,-50%); }
  body[data-space="image"] #space-bg { background:rgba(2,5,15,var(--image-dim, .28)); opacity:1; filter:none; }
  body[data-space="image"] #space-bg::before, body[data-space="image"] #space-bg::after { display:none !important; }
  /* Procedural WebGL nebula: real GPU-rendered fractal clouds, depth haze and stars. */
  #cosmic-webgl { position:absolute; inset:0; width:100%; height:100%; z-index:0; display:none; pointer-events:none; background:#02030a; }
  body[data-constellation][data-space="nebula3d"] #cosmic-webgl { display:block; }
  body[data-constellation][data-space="nebula3d"] #space-bg { opacity:0 !important; animation:none !important; }
  body[data-constellation][data-space="nebula3d"] #cosmic-webgl { opacity:1; }
  body[data-space="nebula3d"] #album-cover-backdrop { display:none !important; }
  #nebula-palette-setting { display:none; }
  body[data-space="nebula3d"] #nebula-palette-setting { display:flex; }
  /* Extruded-looking lyric lettering. The shadow colours are derived from the active
     lyric palette, so the effect adds depth without replacing the selected text colours. */
  body[data-lyric-depth="on"] .w { text-shadow: 0 1px 0 color-mix(in srgb,var(--lyric) 72%,#000), 0 2px 0 color-mix(in srgb,var(--lyric) 62%,#000), 0 3px 0 color-mix(in srgb,var(--lyric) 52%,#000), 0 5px 5px rgba(0,0,0,.48); }
  body[data-lyric-depth="on"] .line.now .w { text-shadow: 0 1px 0 color-mix(in srgb,var(--hi) 68%,#000), 0 2px 0 color-mix(in srgb,var(--hi) 56%,#000), 0 3px 0 color-mix(in srgb,var(--lyric) 52%,#000), 0 5px 7px rgba(0,0,0,.52); }
  body[data-lyric-depth="on"] .line.past .w { text-shadow: 0 1px 0 color-mix(in srgb,var(--secondary) 65%,#000), 0 2px 0 color-mix(in srgb,var(--secondary) 48%,#000), 0 4px 5px rgba(0,0,0,.42); }
  #constellation, #lines, #note { z-index:1; }
  #constellation { display:none; position:absolute; inset:0; width:100%; height:100%; overflow:hidden; }
  #constellation-world { transform-box: view-box; transform-origin: 0 0; transition: transform 900ms cubic-bezier(.18,.72,.18,1); will-change: transform; }
  body[data-constellation][data-space="stars"] #space-bg, body[data-constellation][data-space="galaxy"] #space-bg { opacity:1; animation:star-drift 42s linear infinite; }
  body[data-constellation][data-space="stars"] #space-bg { background-image:radial-gradient(circle at 11% 24%,rgba(255,255,255,.96) 0 1.15px,transparent 1.9px),radial-gradient(circle at 68% 17%,rgba(186,224,255,.92) 0 1px,transparent 2px),radial-gradient(circle at 81% 72%,rgba(255,228,177,.9) 0 1.2px,transparent 2.3px),radial-gradient(circle at 28% 76%,rgba(174,211,255,.82) 0 .9px,transparent 1.8px),radial-gradient(circle at 48% 46%,rgba(255,255,255,.7) 0 .75px,transparent 1.5px); background-size:116px 103px,173px 149px,219px 191px,271px 233px,347px 307px; filter:drop-shadow(0 0 3px rgba(170,215,255,.62)); }
  body[data-constellation][data-space="galaxy"] #space-bg { background-image:radial-gradient(ellipse at 19% 35%,rgba(78,84,208,.31),transparent 28%),radial-gradient(ellipse at 78% 66%,rgba(142,57,181,.27),transparent 30%),radial-gradient(ellipse at 54% 48%,rgba(24,116,190,.16),transparent 38%),radial-gradient(circle at 11% 24%,rgba(255,255,255,.94) 0 1.1px,transparent 1.9px),radial-gradient(circle at 68% 17%,rgba(186,224,255,.88) 0 1px,transparent 2px),radial-gradient(circle at 81% 72%,rgba(255,228,177,.86) 0 1.2px,transparent 2.3px),radial-gradient(circle at 28% 76%,rgba(174,211,255,.78) 0 .9px,transparent 1.8px); background-size:auto,auto,auto,116px 103px,173px 149px,219px 191px,271px 233px; filter:drop-shadow(0 0 3px rgba(170,215,255,.58)); }
  /* Layered space depth: distant dust stays faint and slow; nearer stars are brighter,
     larger, and drift slightly faster. The layers remain behind all lyric content. */
  body[data-constellation]:not([data-space="image"]):not([data-space="album-art"]) #space-bg::before,
  body[data-constellation]:not([data-space="image"]):not([data-space="album-art"]) #space-bg::after {
    content:""; position:absolute; inset:-3%; pointer-events:none; background-repeat:repeat;
    will-change:transform,opacity;
  }
  body[data-constellation]:not([data-space="image"]):not([data-space="album-art"]) #space-bg::before {
    opacity:.52;
    background-image:
      radial-gradient(1px 1px at 17px 29px,rgba(205,222,255,.70) 98%,transparent),
      radial-gradient(1px 1px at 81px 67px,rgba(255,255,255,.54) 98%,transparent),
      radial-gradient(1.2px 1.2px at 143px 111px,rgba(168,198,255,.62) 98%,transparent),
      radial-gradient(1px 1px at 211px 41px,rgba(255,255,255,.48) 98%,transparent);
    background-size:257px 193px,311px 227px,367px 281px,421px 317px;
    animation:far-star-drift 110s linear infinite;
  }
  body[data-constellation]:not([data-space="image"]):not([data-space="album-art"]) #space-bg::after {
    opacity:.42;
    background-image:
      radial-gradient(1.7px 1.7px at 31px 53px,rgba(255,255,255,.92) 98%,transparent),
      radial-gradient(2.5px 2.5px at 127px 91px,rgba(190,220,255,.90) 98%,transparent),
      radial-gradient(1.5px 1.5px at 203px 157px,rgba(255,224,180,.82) 98%,transparent),
      radial-gradient(ellipse 18px 18px at 127px 91px,rgba(130,175,255,.13),transparent 100%);
    background-size:293px 239px,397px 307px,487px 359px,397px 307px;
    animation:near-star-drift 58s ease-in-out infinite alternate, star-breathe 9s ease-in-out infinite;
  }
  body[data-constellation][data-space="off"] #space-bg {
    opacity:1;
    background:
      radial-gradient(ellipse at 50% 52%,rgba(28,35,66,.38),transparent 60%),
      linear-gradient(180deg,#050711,#020309 72%,#010205);
  }
  body[data-constellation][data-space="stars"] #space-bg { background-color:#030611; }
  body[data-constellation][data-space="galaxy"] #space-bg { background-color:#02040d; }
  @keyframes far-star-drift { from { transform:translate3d(0,0,0); } to { transform:translate3d(-18px,9px,0); } }
  @keyframes near-star-drift { from { transform:translate3d(0,0,0) scale(1); } to { transform:translate3d(-34px,17px,0) scale(1.015); } }
  @keyframes star-breathe { 0%,100% { opacity:.26; } 50% { opacity:.52; } }
  @media (prefers-reduced-motion: reduce) {
    body[data-constellation] #space-bg,
    body[data-constellation] #space-bg::before,
    body[data-constellation] #space-bg::after,
    body[data-space="animated-universe"] #space-bg,
    body[data-space="animated-universe"] #space-bg::before,
    body[data-space="animated-universe"] #space-bg::after { animation:none !important; }
  }
  body[data-space="image"] #space-bg { opacity:1; }
  /* Animated Universe: a continuously drifting, layered nebula and starfield. This is
     CSS-rendered so it works offline and avoids a large looping video/GIF asset. */
  body[data-space="animated-universe"] #space-bg {
    opacity:1; overflow:hidden; background-color:#02040c;
    background-image:radial-gradient(ellipse at 52% 52%,rgba(11,36,67,.38),transparent 58%),linear-gradient(180deg,#03050e 0%,#03040b 72%,#010207 100%);
    filter:saturate(1.12);
  }
  body[data-space="animated-universe"] #space-bg::before,
  body[data-space="animated-universe"] #space-bg::after {
    content:""; position:absolute; inset:-12%; display:block; pointer-events:none; will-change:transform,background-position,opacity;
  }
  body[data-space="animated-universe"] #space-bg::before {
    opacity:.92; background-repeat:no-repeat;
    background-image:
      radial-gradient(ellipse at 24% 36%,rgba(49,68,174,.25) 0%,rgba(34,50,133,.13) 20%,transparent 44%),
      radial-gradient(ellipse at 72% 58%,rgba(130,43,154,.23) 0%,rgba(83,33,129,.12) 22%,transparent 46%),
      radial-gradient(ellipse at 48% 72%,rgba(12,113,157,.19) 0%,rgba(12,75,127,.09) 25%,transparent 48%),
      radial-gradient(ellipse at 54% 28%,rgba(90,43,139,.12) 0%,transparent 37%),
      radial-gradient(ellipse at 50% 50%,rgba(10,20,50,.12),transparent 62%);
    background-size:130% 135%,140% 145%,135% 140%,130% 125%,100% 100%;
    animation:nebula-drift 72s ease-in-out infinite alternate,nebula-breathe 24s ease-in-out infinite;
  }
  body[data-space="animated-universe"] #space-bg::after {
    opacity:.64; background-repeat:repeat;
    background-image:
      radial-gradient(1px 1px at 23px 37px,rgba(255,255,255,.92) 98%,transparent),
      radial-gradient(1.4px 1.4px at 117px 81px,rgba(194,221,255,.9) 98%,transparent),
      radial-gradient(1px 1px at 193px 147px,rgba(255,235,202,.82) 98%,transparent),
      radial-gradient(2px 2px at 281px 53px,rgba(225,238,255,.82) 98%,transparent),
      radial-gradient(1px 1px at 337px 201px,rgba(166,202,255,.76) 98%,transparent),
      radial-gradient(ellipse 16px 16px at 281px 53px,rgba(112,169,255,.12),transparent 100%);
    background-size:251px 197px,317px 241px,389px 283px,457px 331px,521px 367px,457px 331px;
    animation:universe-star-drift 95s linear infinite,universe-star-twinkle 11s ease-in-out infinite;
  }
  @keyframes nebula-drift { 0% { transform:translate3d(-1.5%,-1%,0) scale(1); } 50% { transform:translate3d(1.2%,1.4%,0) scale(1.055); } 100% { transform:translate3d(-.6%,2%,0) scale(1.025); } }
  @keyframes nebula-breathe { 0%,100% { filter:brightness(.88) saturate(.95); } 50% { filter:brightness(1.14) saturate(1.12); } }
  @keyframes universe-star-drift { from { transform:translate3d(0,0,0); } to { transform:translate3d(-38px,24px,0); } }
  @keyframes universe-star-twinkle { 0%,100% { opacity:.45; } 50% { opacity:.76; } }
  /* Album-art mode: a palette-driven ambient gradient plus a separate, sharp, centered cover. */
  body[data-space="album-art"][data-has-album-art="true"] #space-bg {
    opacity:1; overflow:hidden;
    background: radial-gradient(ellipse at 50% 48%, var(--album-glow, rgba(90,70,90,.38)) 0%, transparent 48%),
                linear-gradient(125deg, var(--album-bg-a, #19191d), var(--album-bg-b, #09090c) 58%, var(--album-bg-c, #202026));
  }
  #album-cover-backdrop { display:none; position:absolute; z-index:0; left:50%; top:50%; transform:translate(-50%,-50%);
    width:auto; height:auto; max-width:min(42vw, 58vh); max-height:72vh; object-fit:contain;
    opacity:0; filter:saturate(.78) brightness(.78);
    border-radius:12px; box-shadow:0 18px 54px rgba(0,0,0,.32); pointer-events:none;
    transition:opacity .35s ease, filter .35s ease; }
  body[data-space="album-art"][data-has-album-art="true"] #album-cover-backdrop { display:block; }
  body[data-space="album-art"]:not([data-has-album-art="true"]) #space-bg { opacity:0; }
  @keyframes star-drift { from { transform:translate3d(0,0,0) rotate(0deg); } to { transform:translate3d(-28px,18px,0) rotate(1deg); } }
  body[data-constellation] #constellation { display:block; }
  body[data-constellation] #lines { display:none; }
  .constellation-edge { stroke:color-mix(in srgb, var(--edge) 52%, transparent); stroke-width:1.15; fill:none; transition:stroke .25s, opacity .25s; }
  .constellation-edge.past { stroke:color-mix(in srgb, var(--past) 52%, transparent); }
  .constellation-edge.active { stroke:var(--edge); stroke-width:2.1; filter:drop-shadow(0 0 4px var(--edge)); }
  .constellation-star { fill:var(--lyric); opacity:.38; transition:opacity .25s, fill .25s, r .25s; }
  .constellation-star.past { fill:var(--past); opacity:.65; }
  .constellation-star.active { fill:var(--hi); opacity:1; filter:drop-shadow(0 0 7px var(--edge)); }
  .constellation-label { fill:var(--lyric); font-size:calc(22px * var(--ui-scale)); font-weight:550; text-anchor:middle; dominant-baseline:central; transition:opacity .25s, fill .25s; pointer-events:none; }
  .constellation-label.past { fill:var(--past); }
  .constellation-label.active { fill:var(--hi); font-size:calc(44px * var(--ui-scale)); font-weight:800; filter:drop-shadow(0 0 13px var(--edge)); }
  .constellation-label.past { opacity:.36; }
  .constellation-star.active { r:7; }
  body[data-style^="constellation-"] .constellation-edge { transition:stroke .35s,opacity .55s; }
  body[data-style^="constellation-"] .constellation-label { transition:opacity .55s,fill .35s,font-size .45s; }
  body[data-style="constellation-nebula"] #stage:before { content:""; position:absolute; inset:-20%; background:radial-gradient(ellipse at 30% 45%,rgba(90,50,180,.18),transparent 40%),radial-gradient(ellipse at 75% 60%,rgba(20,100,190,.13),transparent 42%); pointer-events:none; }
  body[data-style="constellation-evolving"] .constellation-label.future, body[data-style="constellation-evolving"] .constellation-star.future { opacity:.04; }
  body[data-style="constellation-hybrid"] .constellation-label.far { opacity:.12; }
  body[data-style="constellation-hybrid"] .constellation-star.far { opacity:.12; }
  body[data-style="constellation-orbit"] .constellation-star.active { stroke:rgba(100,190,255,.8); stroke-width:9; stroke-opacity:.25; }
  /* Flow borrows Icons' word-to-emoji matching; the emoji appears only while its word is active. */
  .constellation-icon { text-anchor:middle; dominant-baseline:central; font-size:28px; opacity:0; transform-box:fill-box; transform-origin:center; pointer-events:none; transition:opacity .2s, font-size .25s; }
  .constellation-icon.active { opacity:1; font-size:38px; filter:drop-shadow(0 2px 8px rgba(0,0,0,.48)); }
  #lines { position: absolute; left: var(--pad); right: var(--pad); top: 0; }

  /* ---- shared building blocks ---- */
  .line { margin: 0; font-size: var(--fs); line-height: 1.14; font-weight: 700; letter-spacing: -.015em; opacity: 0; }
  .line.gap { display: none; }
  .wd { display: inline-block; position: relative; margin-right: .26em; transition: transform .18s var(--ease); }
  .w { display: inline-block; --p: 0; color: transparent; -webkit-background-clip: text; background-clip: text;
       background-image: linear-gradient(90deg, var(--hi) calc(var(--p) * 116% - 16%), var(--lyric) calc(var(--p) * 116%)); }
  .line:not(.now) .w { background-image: none; color: var(--lyric); }
  .line.past .w { color: var(--secondary); }
  .ic { display: none; }
  #hop { display: none; }

  /* ---- Focus: a scrolling column; the sung line is large, neighbours shrink and fade ---- */
  body[data-style="focus"] .line { position: relative; margin-bottom: .5em; transform-origin: left center;
       transition: transform .55s var(--ease), opacity .55s var(--ease); }
  body[data-style="focus"] #lines { transition: transform .55s var(--ease); will-change: transform; }
  body[data-style="focus"] .line.now { opacity: 1; }
  body[data-style="focus"] .line.f1, body[data-style="focus"] .line.p1 { opacity: .55; transform: scale(.62); }
  body[data-style="focus"] .line.f2, body[data-style="focus"] .line.p2 { opacity: .22; transform: scale(.5); }

  /* ---- shared for styles that stack lines on top of each other ---- */
  body[data-abs] #lines { bottom: 0; }
  body[data-abs] .line { position: absolute; left: 0; right: 0; top: 50%; transform-origin: left center;
       transition: transform .6s var(--ease), opacity .45s ease, filter .45s ease; }

  /* ---- Hopper and Icons: one line on screen; the old line lifts away, the next one arrives ---- */
  body[data-single] .line { --fs: clamp(34px, 6.2vw, 96px); transform: translateY(-50%); }
  body[data-single] .line.p1, body[data-single] .line.p2, body[data-single] .line.p3 { transform: translateY(calc(-50% - .55em)); filter: blur(.1em); }
  body[data-single] .line.f1, body[data-single] .line.f2, body[data-single] .line.f3 { transform: translateY(calc(-50% + .55em)); filter: blur(.1em); }
  body[data-single] .line.now { opacity: 1; transform: translateY(-50%); filter: none; }

  /* Hopper: a bar jumps from word to word */
  body[data-style="hopper"] #hop { display: block; position: absolute; height: .085em; border-radius: 99px; margin-top: .04em;
       background: var(--hi); box-shadow: 0 0 .6em var(--hi); pointer-events: none;
       transition: left .26s cubic-bezier(.34,1.56,.64,1), width .26s cubic-bezier(.34,1.56,.64,1), top .26s var(--ease); }
  body[data-style="hopper"] #hop.jump { animation: hopjump .26s ease-out; }
  @keyframes hopjump { 0% { margin-top: .04em; } 45% { margin-top: -.3em; } 100% { margin-top: .04em; } }

  /* Stroke Lines: line-by-line outlined typography inspired by Three.js' text-stroke
     example. The face still uses the app's lyric palette; only the outline/extrusion
     is added, and is derived from --lyric / --hi rather than hard-coded colours. */
  body[data-style="stroke-lines"] #lines { perspective:1200px; transform-style:preserve-3d; }
  body[data-style="stroke-lines"] .line { left:4%; right:4%; text-align:center; transform-origin:center center;
       font-size:clamp(30px, 5.2vw, 78px); line-height:1.28; letter-spacing:-.025em; }
  body[data-style="stroke-lines"] .line.p1,
  body[data-style="stroke-lines"] .line.p2,
  body[data-style="stroke-lines"] .line.p3,
  body[data-style="stroke-lines"] .line.f1,
  body[data-style="stroke-lines"] .line.f2,
  body[data-style="stroke-lines"] .line.f3 { opacity:0 !important; pointer-events:none; }
  body[data-style="stroke-lines"] .line.now { opacity:1; transform:translateY(-50%) rotateX(-5deg) translateZ(0); filter:none; }
  body[data-style="stroke-lines"] .line.now .w {
       -webkit-text-stroke: .65px color-mix(in srgb, var(--lyric) 88%, transparent);
       paint-order:stroke fill;
       text-shadow: 0 1px 0 color-mix(in srgb,var(--lyric) 88%,#000),
                    0 2px 0 color-mix(in srgb,var(--lyric) 76%,#000),
                    0 3px 0 color-mix(in srgb,var(--lyric) 64%,#000),
                    0 4px 0 color-mix(in srgb,var(--lyric) 50%,#000),
                    0 8px 12px rgba(0,0,0,.5);
  }
  body[data-style="stroke-lines"] .line.now .wd.cur .w,
  body[data-style="stroke-lines"] .line.now .wd.sung .w {
       -webkit-text-stroke-color:color-mix(in srgb,var(--hi) 82%,transparent);
       text-shadow: 0 1px 0 color-mix(in srgb,var(--hi) 78%,#000),
                    0 2px 0 color-mix(in srgb,var(--hi) 62%,#000),
                    0 3px 0 color-mix(in srgb,var(--lyric) 62%,#000),
                    0 5px 0 color-mix(in srgb,var(--lyric) 48%,#000),
                    0 9px 14px rgba(0,0,0,.52);
  }
  body[data-style="stroke-lines"] .line.now .wd { margin-right:.24em; }

  /* Icons: a matched emoji pops in above each word as it starts */
  body[data-style="icons"] .line { padding-top: .9em; }
  body[data-style="icons"] .ic { display: block; position: absolute; left: 50%; top: -.95em; font-size: .62em; line-height: 1;
       transform: translateX(-50%) scale(0); opacity: 0; pointer-events: none;
       font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
       transition: transform .32s cubic-bezier(.3,1.7,.5,1), opacity .2s; }
  body[data-style="icons"] .wd.sung .ic { transform: translateX(-50%) scale(1); opacity: 1; }

  /* Lens: lines bow and shrink away from the sung word, like a convex lens */
  body[data-style="lens"] #lines { perspective: 1100px; }
  body[data-style="lens"] .wd.cur { transform: scale(1.1); }

  /* Drift: lines sit at different depths while the whole wall sways slowly */
  body[data-style="drift"] #stage { perspective: 1400px; }
  body[data-style="drift"] #lines { transform-style: preserve-3d; transform: rotateX(var(--rx, 5deg)) rotateY(var(--ry, 0deg)); }
  body[data-style="drift"] .line { transform-style: preserve-3d; }
  body[data-style="drift"] .wd.cur { transform: translateZ(50px) scale(1.1); }

  /* ---- chrome ---- */
  #meta { position:absolute; right:24px; bottom:24px; max-width:min(58vw, 720px); display:flex; align-items:center; justify-content:flex-end; gap:12px; font-size:calc(15px * var(--ui-scale)); letter-spacing:.01em; }
  #meta-copy { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
  #meta b { color: var(--hi); font-weight: 600; margin-right: .6em; }

    padding:14px; border:1px solid rgba(160,190,245,.2); border-radius:16px; background:rgba(8,13,27,.92);
    box-shadow:0 18px 60px rgba(0,0,0,.42); backdrop-filter:blur(22px); opacity:0; visibility:hidden; transform:translateY(-6px) scale(.985);
    transform-origin:top left; transition:opacity .16s ease,transform .16s ease,visibility .16s; max-height:calc(100vh - 82px); overflow-y:auto; overscroll-behavior:contain; scrollbar-color:rgba(150,195,255,.6) transparent; }
  #picker.open { opacity:1; visibility:visible; transform:translateY(0) scale(1); }
  #picker .panel-title { margin:0 0 2px; color:#e8f1ff; font-size:13px; font-weight:650; letter-spacing:.04em; }
  #picker .setting { display:flex; flex-direction:column; align-items:stretch; gap:5px; padding:8px 9px; border:1px solid rgba(255,255,255,.08); border-radius:10px; background:rgba(255,255,255,.035); }
  #picker .setting-label { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:rgba(210,224,255,.65); }
  #picker select { max-width:100%; width:100%; }
  #picker select, #picker button { font-size:13px; }
  #picker select { font:inherit; font-size:13px; color:#e6efff; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13); border-radius:8px; padding:9px 10px; cursor:pointer; }

<script>
(function () {
  const E = window.LyricalEngine, I = window.LyricalIcons;
  const $ = id => document.getElementById(id);
  const hosted = !!(window.chrome && window.chrome.webview);
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const L = $('lines'), hop = $('hop');

  const STYLES = {
    focus:  { label: 'Focus' },                          // scrolling column
    hopper: { label: 'Hopper', abs: true, single: true }, // one line, a bar hops between words
    lens:   { label: 'Lens',   abs: true },               // convex lens falloff
    drift:  { label: 'Drift',  abs: true },               // 3D wall, slowly swaying
    icons:  { label: 'Icons',  abs: true, single: true }, // emoji pop in beside words
    'stroke-lines': { label: '3D Stroke · Lines', abs: true, single: true }, // outlined 3D line-by-line lyrics
    swordsman: { label: 'Swordsman · 3D Combat', abs: true, single: true }, // 3D dark-fantasy lyric combat scene
    'constellation-fixed': { label: 'Constellation · Fixed' },
    'constellation-evolving': { label: 'Constellation · Evolving' },
    'constellation-flow': { label: 'Constellation · Flow' },
    'constellation-hybrid': { label: 'Constellation · Hybrid' },
    'constellation-nebula': { label: 'Constellation · Nebula' },
    'constellation-orbit': { label: 'Constellation · Orbit' }
  };

  const svg = $('constellation');
  let constellationWorld = null;
  let constellationPoints = [];
  let constellationSize = { width: 0, height: 0 };
  const state = { doc: null, clock: new E.PlaybackClock(), offset: 0, active: -2, lastWord: -2, els: [], ord: [], lastP: {}, style: 'focus', stars: [], edges: [], activeGlobal: -1 };
  try { state.offset = Number(localStorage.getItem('Lyrical.offset')) || 0; } catch (_) {}
  const settingsTrigger = $('settings-trigger'), settingsPanel = $('picker');
  function setSettingsOpen(open) {
    settingsPanel.classList.toggle('open', open);
    settingsPanel.setAttribute('aria-hidden', String(!open));
    settingsTrigger.setAttribute('aria-expanded', String(open));
    settingsTrigger.setAttribute('aria-label', open ? 'Close display settings' : 'Open display settings');
  }
  settingsTrigger.addEventListener('click', e => {
    e.stopPropagation();
    setSettingsOpen(!settingsPanel.classList.contains('open'));
  });
  settingsPanel.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => setSettingsOpen(false));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && settingsPanel.classList.contains('open')) {
      setSettingsOpen(false); settingsTrigger.focus();
    }
  });

  const windowPicker = $('word-window'), zoomPicker = $('zoom');
  let wordWindow = '5';
  try {
    wordWindow = localStorage.getItem('Lyrical.wordWindow') || '5';
    const savedZoom = localStorage.getItem('Lyrical.zoom') || '1.25';
    if ([...zoomPicker.options].some(o => o.value === savedZoom)) zoomPicker.value = savedZoom;
    document.documentElement.style.setProperty('--ui-scale', zoomPicker.value);
  } catch (_) {}
  windowPicker.value = wordWindow;
  windowPicker.addEventListener('change', () => {
    wordWindow = windowPicker.value;
    try { localStorage.setItem('Lyrical.wordWindow', wordWindow); } catch (_) {}
    updateConstellation(state.activeGlobal);
  });
  zoomPicker.addEventListener('change', () => {
    document.documentElement.style.setProperty('--ui-scale', zoomPicker.value);
    document.body.dataset.zoom = zoomPicker.value;
    try { localStorage.setItem('Lyrical.zoom', zoomPicker.value); } catch (_) {}
    state.active = -2; buildConstellation();
  });

  // ---------- colour schemes ----------
  // Curated for dark lyric surfaces: high-luminance active text and a distinct
  // path accent keep constellation links readable without competing with words.
  const COLOUR_SCHEMES = {
    midnight: { bg:'#0e1020', lyric:'#4d5480', hi:'#ffe2b0', edge:'#69afff', secondary:'#7c84b3', past:'#c7a77f' },
    aurora:   { bg:'#071a20', lyric:'#5a8290', hi:'#d8fff2', edge:'#54e3b7', secondary:'#91bac1', past:'#8ac7b2' },
    nebula:   { bg:'#160d2b', lyric:'#766298', hi:'#ffe1fb', edge:'#b895ff', secondary:'#a998c5', past:'#d9a7dc' },
    ember:    { bg:'#21100d', lyric:'#8c6254', hi:'#fff0cf', edge:'#ff9c6a', secondary:'#c89986', past:'#e4b18a' }
  };
  const colourSchemePicker = $('colour-scheme');
  const colourInputs = { bg:$('colour-bg'), hi:$('colour-hi'), lyric:$('colour-lyric'), edge:$('colour-edge') };
  const artNote = $('art-note');
  let albumArtDataUrl = null;

  function setColourVariables(colours) {
    const root = document.documentElement.style;
    root.setProperty('--bg', colours.bg);
    root.setProperty('--lyric', colours.lyric);
    root.setProperty('--hi', colours.hi);
    root.setProperty('--edge', colours.edge);
    root.setProperty('--secondary', colours.secondary || colours.lyric);
    root.setProperty('--past', colours.past || colours.edge);
    Object.entries(colourInputs).forEach(([key, input]) => { if (colours[key]) input.value = colours[key]; });
    if (hosted) window.chrome.webview.postMessage({ type:'setChromeColor', color:colours.bg });
  }
  function saveColours() {
    try {
      localStorage.setItem('Lyrical.colourScheme', colourSchemePicker.value);
      localStorage.setItem('Lyrical.customColours', JSON.stringify(Object.fromEntries(Object.entries(colourInputs).map(([key, input]) => [key, input.value]))));
    } catch (_) {}
  }
  function applyScheme(name, quiet) {
    if (COLOUR_SCHEMES[name]) {
      setColourVariables(COLOUR_SCHEMES[name]);
      artNote.textContent = 'Curated for dark lyric surfaces and bright, readable active words.';
    } else if (name === 'custom') {
      setColourVariables(Object.fromEntries(Object.entries(colourInputs).map(([key, input]) => [key, input.value])));
      artNote.textContent = 'Custom colours apply to the background, words, and constellation paths/effects.';
    } else if (name === 'album') {
      if (albumArtDataUrl) deriveAlbumColours(albumArtDataUrl);
      else artNote.textContent = 'Waiting for album art. Midnight Gold remains active if this session has no thumbnail.';
    }
    if (!quiet) toast(name === 'album' ? 'Colours: match album art' : 'Colours: ' + colourSchemePicker.options[colourSchemePicker.selectedIndex].text);
    saveColours();
  }
  function hex(rgb) { return '#' + rgb.map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join(''); }
  function mix(a, b, amount) { return a.map((v, i) => v * (1 - amount) + b[i] * amount); }
  function luminance(rgb) {
    const channel = value => { value /= 255; return value <= .04045 ? value / 12.92 : Math.pow((value + .055) / 1.055, 2.4); };
    return .2126 * channel(rgb[0]) + .7152 * channel(rgb[1]) + .0722 * channel(rgb[2]);
  }
  function contrast(a, b) { const x = luminance(a), y = luminance(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
  function deriveAlbumColours(dataUrl) {
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas'); canvas.width = canvas.height = 40;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      context.drawImage(image, 0, 0, 40, 40);
      const pixels = context.getImageData(0, 0, 40, 40).data, buckets = new Map();
      for (let i = 0; i < pixels.length; i += 4) {
        if (pixels[i + 3] < 180) continue;
        const colour = [pixels[i] >> 4 << 4, pixels[i + 1] >> 4 << 4, pixels[i + 2] >> 4 << 4];
        const key = colour.join(','); buckets.set(key, (buckets.get(key) || 0) + 1);
      }
      const ranked = [...buckets.entries()].sort((a, b) => b[1] - a[1]).map(([key]) => key.split(',').map(Number));
      const dominant = ranked[0] || [32, 52, 85];
      const accent = ranked.find(c => Math.max(...c) - Math.min(...c) > 48 && luminance(c) > .08) || dominant;
      const background = mix(dominant, [0, 0, 0], .82);
      const accentDark = mix(accent, [0, 0, 0], .72);
      const secondaryDark = mix(ranked[1] || dominant, [0, 0, 0], .84);
      document.documentElement.style.setProperty('--album-bg-a', hex(background));
      document.documentElement.style.setProperty('--album-bg-b', hex(mix(background, [0,0,0], .62)));
      document.documentElement.style.setProperty('--album-bg-c', hex(secondaryDark));
      document.documentElement.style.setProperty('--album-glow', hex(accentDark));
      const active = contrast([255, 255, 255], background) >= 4.5 ? [255, 255, 255] : [255, 244, 222];
      const colours = { bg:hex(background), hi:hex(active), lyric:hex(mix(accent, [255,255,255], .18)), edge:hex(mix(accent, [255,255,255], .42)), secondary:hex(mix(accent, [255,255,255], .32)), past:hex(mix(accent, [255,225,188], .35)) };
      setColourVariables(colours);
      artNote.textContent = 'Matched to the current album art with a dark ambient gradient for lyric contrast.';
    };
    image.onerror = () => { artNote.textContent = 'Album art could not be read; Midnight Gold remains active.'; };
    image.src = dataUrl;
  }
  function setAlbumArt(dataUrl) {
    albumArtDataUrl = dataUrl || null;
    const image = $('album-art');
    image.hidden = !albumArtDataUrl;
    if (albumArtDataUrl) {
      image.src = albumArtDataUrl;
      $('album-cover-backdrop').src = albumArtDataUrl;
      document.documentElement.style.setProperty('--album-background', `url("${albumArtDataUrl}")`);
    } else {
      image.removeAttribute('src');
      $('album-cover-backdrop').removeAttribute('src');
      document.documentElement.style.setProperty('--album-background', 'none');
    }
    document.body.dataset.hasAlbumArt = String(!!albumArtDataUrl);
    if (document.body.dataset.space === 'album-art') {
      const note = $('background-note');
      if (note) note.textContent = albumArtDataUrl
        ? 'Showing the original artwork centered over a palette-matched ambient gradient.'
        : 'No artwork is available for this track. The album-art background will appear when artwork is provided.';
    }
    if (colourSchemePicker.value !== 'album') return;
    if (albumArtDataUrl) deriveAlbumColours(albumArtDataUrl);
    else {
      setColourVariables(COLOUR_SCHEMES.midnight);
      artNote.textContent = 'This media session did not provide album art; Midnight Gold is being used.';
    }
  }
  try {
    const savedScheme = localStorage.getItem('Lyrical.colourScheme') || 'midnight';
    const savedCustom = JSON.parse(localStorage.getItem('Lyrical.customColours') || 'null');
    if (savedCustom) Object.entries(colourInputs).forEach(([key, input]) => { if (savedCustom[key]) input.value = savedCustom[key]; });
    colourSchemePicker.value = [...colourSchemePicker.options].some(option => option.value === savedScheme) ? savedScheme : 'midnight';
  } catch (_) {}
  applyScheme(colourSchemePicker.value, true);
  colourSchemePicker.addEventListener('change', () => applyScheme(colourSchemePicker.value));
  Object.values(colourInputs).forEach(input => input.addEventListener('input', () => {
    colourSchemePicker.value = 'custom'; applyScheme('custom', true); saveColours();
  }));

  // Self-contained WebGL nebula renderer. It borrows the procedural-noise approach
  // used by public Three.js galaxy/nebula demos, but has no CDN/runtime dependency.
  const cosmicCanvas = $('cosmic-webgl');
  (function initCosmicWebGL() {
    if (!cosmicCanvas) return;
    const gl = cosmicCanvas.getContext('webgl', { alpha:false, antialias:false, depth:false, stencil:false, powerPreference:'low-power' });
    if (!gl) {
      cosmicCanvas.style.background = 'radial-gradient(ellipse at 28% 38%,rgba(52,75,181,.46),transparent 35%),radial-gradient(ellipse at 72% 62%,rgba(133,43,170,.4),transparent 38%),radial-gradient(ellipse at 55% 25%,rgba(18,125,154,.2),transparent 42%),#02030a';
      return;
    }
    const vertex = `attribute vec2 a_position; void main(){ gl_Position=vec4(a_position,0.0,1.0); }`;
    const fragment = `
      precision mediump float;
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform float u_motion;
      uniform int u_palette;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
      float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y); }
      float fbm(vec2 p){ float v=0.0,a=.52; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p+vec2(7.1,3.7); a*=.5; } return v; }
      void main(){
        vec2 uv=gl_FragCoord.xy/u_resolution.xy; vec2 p=(uv-.5)*vec2(u_resolution.x/u_resolution.y,1.0);
        float t=u_time*u_motion;
        vec2 flow=vec2(t*.018,-t*.011);
        float warp=fbm(p*2.0+flow);
        vec2 q=p*2.15+vec2(warp*1.7,-warp*1.25)+flow;
        float clouds=fbm(q+fbm(q*1.7+vec2(4.2,-2.7))*.8);
